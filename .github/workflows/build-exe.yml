name: Build AHK Script Manager

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish x64 single-file EXE
        run: dotnet publish src/AHKScriptManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AHK-Script-Manager-v3.4.3-win-x64
          path: publish/AHKScriptManager.exe
